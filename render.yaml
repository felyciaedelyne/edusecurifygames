services:
  - type: web
    name: edusecurity
    runtime: python
    plan: free
    # Latih model di build supaya cocok dengan versi scikit-learn di server Render
    buildCommand: pip install -r requirements.txt && python train_medsos.py
    startCommand: gunicorn server:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ADMIN_TOKEN
        generateValue: true
